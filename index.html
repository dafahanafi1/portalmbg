<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBG PORTAL</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<header>

<img src="logo-bgn.png" class="logo">

<h1>MBG PORTAL</h1>

<p class="subtitle">

Semua Sistem MBG Dalam Satu Tempat

</p>

<p class="creator">

BY : SPPG Plupuh Karangwaru 2

</p>

</header>

<div class="searchBox">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="search"
placeholder="Cari menu...">

</div>

<div id="menuContainer">

<!-- Menu dari script.js -->

</div>

<footer>

MBG PORTAL © 2026

</footer>

</div>

<div class="right">

<div class="donasiCard">

<h2>

❤️ Dukung Pengembangan

</h2>

<p>

Portal ini dibuat untuk membantu operasional MBG.

Jika bermanfaat silakan support pengembang.

</p>

<img
src="qris.png"
class="qris">

<button id="openQR">

Perbesar QRIS

</button>

</div>

<div class="jumlahCard">

<h3>Total Menu</h3>

<h1 id="jumlahMenu">

11

</h1>

</div>

</div>

</div>

<div id="popup">

<div class="popupContent">

<span id="close">

×

</span>

<h2>

QRIS DONASI

</h2>

<img src="qris.png">

<p>

Terima kasih atas dukungan Anda ❤️

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
