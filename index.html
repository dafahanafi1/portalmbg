<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MBG PORTAL</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container py-4">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="portal-card">

<div class="text-center">

<img src="logo-bgn.png" class="logo">

<h1 class="title">

MBG PORTAL

</h1>

<p class="subtitle">

Semua Sistem MBG Dalam Satu Tempat

</p>

<p class="creator">

BY : SPPG Plupuh Karangwaru 2

</p>

</div>

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
id="search"
type="text"
placeholder="Cari Menu...">

</div>

<div id="menuContainer">

</div>

<div class="footer">

MBG PORTAL © 2026

</div>

</div>

</div>

<div class="col-lg-4">

<div class="donasi-card">

<h3>

❤️ Dukung Pengembangan

</h3>

<p>

Portal ini dibuat untuk membantu operasional MBG.

</p>

<img
src="qris.png"
class="qris">

<button
class="btn btn-primary w-100 mt-3"
id="openQR">

Perbesar QRIS

</button>

</div>

<div class="jumlah-card">

<h5>Total Menu</h5>

<h1 id="jumlahMenu">

11

</h1>

</div>

</div>

</div>

</div>

<div id="popup">

<div class="popup-box">

<span id="closePopup">

×

</span>

<h3>

QRIS DONASI

</h3>

<img src="qris.png">

<p>

Terima kasih atas dukungan Anda ❤️

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
