<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MBG PORTAL</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="background"></div>

<div class="wrapper">

<div class="main">

<div class="header">

<img src="logo-bgn.png" class="logo">

<h1>MBG PORTAL</h1>

<p>Semua Sistem MBG Dalam Satu Tempat</p>

<span>BY : SPPG Plupuh Karangwaru 2</span>

<input
id="search"
type="text"
placeholder="🔍 Cari menu...">

</div>

<div id="menu"></div>

</div>

<aside class="sidebar">

<div class="donasi">

<h2>❤️ Dukung Pengembangan</h2>

<p>

Portal ini dibuat untuk membantu operasional MBG.

Jika bermanfaat silakan support pengembang.

</p>

<img src="qris.png" class="qris">

<button id="lihatQR">

Perbesar QRIS

</button>

</div>

<div class="info">

<h3>Total Menu</h3>

<h1 id="jumlahMenu">11</h1>

</div>

</aside>

</div>

<div id="popup">

<div class="popupCard">

<span id="close">

×

</span>

<h2>

QRIS DONASI

</h2>

<img src="qris.png">

<p>

Terima kasih atas dukungan Anda ❤️

</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
